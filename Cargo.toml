[package]
name = "rhwp"
version = "0.8.7"
edition = "2021"
description = "HWP/HWPX/HWP3 document engine (parse, layout, edit, serialize) used by the macOS app"
license = "MIT"
repository = "https://github.com/edwardkim/rhwp"
autotests = false
autoexamples = false

[workspace]
members = [".", "crates/*", "bindings/Native"]
default-members = [".", "crates/*"]
resolver = "2"

[lib]
# 엔진은 rlib 하나다. macOS 앱은 bindings/Native 가 이 rlib 을 정적 라이브러리(XCFramework)로 감싸 쓴다.
crate-type = ["rlib"]

